<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css" />
    <script>
      // 첫 화면부터 저장된 테마를 적용해 깜빡임을 막는다 (기본값: 게임보이)
      try {
        if (localStorage.getItem('theme') !== 'default') document.documentElement.classList.add('theme-gameboy', 'dark')
      } catch (e) {
        document.documentElement.classList.add('theme-gameboy', 'dark')
      }
    </script>
    <title>ETF Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
