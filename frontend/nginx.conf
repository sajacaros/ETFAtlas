# 웹소켓을 쓸 때만 Connection: upgrade를 보내고, 아니면 비워 백엔드와 keep-alive로 잇는다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 매번 새로 확인해야 배포 직후에도 새 번들을 받는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # vite 번들은 파일 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api {
        # 변수로 넘기면 요청마다 Docker DNS로 backend IP를 다시 찾는다.
        # 고정 이름이면 시작할 때 한 번만 찾아, backend만 재생성하면 옛 IP로 보내 502가 난다.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 채팅·스크리너·알림은 SSE로 조금씩 흘려보낸다 — 모아 두지 말고 바로 넘긴다
        proxy_buffering off;
        proxy_cache off;
        # 답변 생성은 단계 사이가 길 수 있다 (서버가 heartbeat를 보내지만 넉넉히)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
